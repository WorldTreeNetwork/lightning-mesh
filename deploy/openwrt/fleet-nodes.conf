# mjolnir-mesh fleet inventory — the maintainer's bootstrap/recovery node list
# (docs/deploy/node-operations.md: the CRDT announcement [buw.9] will be the
# LIVE inventory; this file is the hand-kept ground truth it boots from).
#
# Format (pipe-separated, one node per line, # comments):
#   name|ssh_addr|node_id|model|notes|group
#
# - group is who shares a gossip peer list.
#   house — on this backhaul right now.
#   bench — a unit on the cable, not a peer of house.
#   away — a known node id that did not answer and was not a mesh station
#   on 2026-11-03. Kept so the id is not lost. Not a house peer. Move the
#   line back to house when that radio is on this mesh again.
#   An empty group means house.
# - ssh_addr is the fallback dial address. 10.254 is not assigned on current
#   nodes. deploy/openwrt/fleet-scan.sh records who answered in
#   ~/.config/lightning-admin/fleet-reach.json, and rollout tools dial that
#   address when the node id is in it. The scan does not rewrite this file.
#   Guild names live in ~/.config/lightning-admin/guilds.json.
# - The two house nodes are mesh-only from this laptop. Their link-locals are
#   on wr3000s-bench's br-mesh. This machine dials them as Host mesh-indoor
#   and Host mesh-outdoor (ProxyJump root@192.168.1.1) while the bench cable
#   is on a box at 192.168.1.1. On 2026-11-04 the cable is on tr3000-b
#   (eth d4:0d:ab:46:2f:e8). Radios in the room: outdoor-b, tr3000,
#   wr3000s-bench, and tr3000-b (group bench). On 2026-11-13 the cable is on
#   tr3000 and wr3000s-bench answers at its claimed LAN 10.42.242.1.
# - Operator view: bash deploy/openwrt/fleet-file.sh --reference /path/to/house-guild-id
#   The printed house /128 is the reference (router_ula in Rust Display form).
# - update-fleet.sh walks this file TOP TO BOTTOM: order it leaf-first and put
#   the usually-wired jump node LAST, so a halted rollout never strands the
#   nodes behind an already-updated transit hop.
# - a node fresh from the flash is NOT in here yet: provision it with
#   install-node.sh over ethernet first, then add its line in the right group.
# - peers are the other members of the same group (full set, not a chain).
#   Pending lines (addr and node_id are `-`) are hardware with no id yet.
#   They are not peers and rollout tools skip them.
# - This file is the current installation. Another installation is a separate
#   file: LIGHTNING_FLEET_FILE, or LIGHTNING_FLEET=<name> for
#   fleet.d/<name>.conf (see fleet-file.sh). Do not merge households here.

