[package]
name = "lightning-admin"
version = "0.1.0"
description = "Operator desktop for Lightning Mesh"
authors = ["World Tree Network Foundation"]
edition = "2021"
license = "AGPL-3.0-or-later"

# Nested under lightning-mesh but not a workspace member of crates/*.
[workspace]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lightning_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
if-addrs = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "process"] }
# Signer for identikey-keyspace-v1. Same rev identikey-core uses.
# Admin signs membership ops. It does not mint or wrap a guild PTK.
identikey-log = { git = "https://github.com/identikey/identikey-protocol.git", rev = "093ceb13148d5fb5267ad309ecdfea15f2637d9e" }
dcbor = "=0.25.2"
mjolnir-mesh = { path = "../../crates/mjolnir-mesh" }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
rand = "0.8"
rhai = "1.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "0.6", features = ["all"] }
futures-util = "0.3"
rtnetlink = { version = "0.23", features = ["tokio"] }
netlink-packet-route = "0.33"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
