[package]
name = "mjolnir-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone iroh mesh node for the mjolnir-mesh private network"

[dependencies]
# Reuse mjolnir-mesh's types (GossipMessage, PeerRoster, etc.)
mjolnir-mesh = { path = "../mjolnir-mesh", features = ["daemon"] }

# iroh networking (same versions as workspace)
iroh = { workspace = true }
iroh-gossip = { workspace = true }
iroh-mdns-address-lookup = "0.4"

# async runtime
tokio = { workspace = true }

# serialization
serde = { workspace = true }
postcard = { workspace = true }
bytes = { workspace = true }
blake3 = { workspace = true }

# CLI
clap = { workspace = true, features = ["derive"] }

# utilities
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
data-encoding = { workspace = true }
rand = { workspace = true }
ed25519-dalek = "2.2.0"
thiserror = { workspace = true }
futures-lite = { workspace = true }
async-trait = "0.1"
dirs = "6"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
